appId: gg.eternal.client
productName: Eternal Client
directories:
  output: release
files:
  - dist/renderer/**/*
  - electron/**/*
  - assets/**/*
  - package.json
asar: true
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Eternal Client
publish: null
