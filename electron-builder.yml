appId: gg.eternal.client
productName: Eternal Client
directories:
  output: release
  buildResources: build
files:
  - dist/renderer/**/*
  - electron/**/*
  - assets/**/*
  - package.json
asar: true
artifactName: Eternal.Client.Setup.${version}.${ext}
win:
  icon: build/icon.svg
  executableName: Eternal Client
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Eternal Client
publish:
  provider: github
  owner: 1x1x1x1x1-Ammar
  repo: Eternal-Client
  releaseType: release
