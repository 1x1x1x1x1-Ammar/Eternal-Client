name: Apply Eternal v5

on:
  push:
    branches: [main]
    paths:
      - '.v5-stage/**'
      - '.github/workflows/apply-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged v5 website
        shell: bash
        run: |
          set -euo pipefail
          cat .v5-stage/chunk-*.b64 | base64 -d > /tmp/eternal-v5.tgz
          tar -xzf /tmp/eternal-v5.tgz -C website
          rm -rf .v5-stage
          rm -f .github/workflows/apply-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy Eternal SMP premium v5 website"
          git push
