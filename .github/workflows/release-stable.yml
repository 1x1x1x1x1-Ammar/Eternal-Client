name: Eternal Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.release/v1.0.0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eternal-release-v1.0.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0
  CORE_VERSION: 1.0.0

jobs:
  release:
    name: Build, verify and publish Eternal v1
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Eternal Core v1
        working-directory: eternal-core
        run: gradle clean build --stacktrace

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install launcher dependencies
        run: npm install

      - name: Stage verified Eternal Core
        run: node scripts/stage-core.mjs

      - name: Validate standalone Core JAR metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'assets/eternal-core.jar')) { throw 'Staged Eternal Core JAR is missing.' }
          $entries = & jar tf assets/eternal-core.jar
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Eternal Core JAR.' }
          foreach ($required in @('fabric.mod.json','assets/eternal-core/icon.png','gg/eternal/core/EternalCore.class')) {
            if ($entries -notcontains $required) { throw "Standalone Core is missing $required" }
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'eternal-core-fabric.mod.json'
          Push-Location $env:RUNNER_TEMP
          & jar xf "$env:GITHUB_WORKSPACE/assets/eternal-core.jar" fabric.mod.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract fabric.mod.json.' }
          $metadata = Get-Content 'fabric.mod.json' -Raw | ConvertFrom-Json
          Pop-Location
          if ($metadata.version -ne $env:CORE_VERSION) { throw "Core metadata version mismatch: $($metadata.version)" }
          if ($metadata.id -ne 'eternal-core') { throw "Unexpected Core mod id: $($metadata.id)" }
          Write-Host 'Standalone Eternal Core v1 metadata validated.' -ForegroundColor Green

      - name: Run full launcher and release regression suite
        run: npm run test

      - name: Build renderer and branded Windows resources
        run: npm run build

      - name: Verify stable version and Eternal branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.0.0') { throw "package.json is not stable v1: $($pkg.version)" }
          if (!(Test-Path 'build/icon.svg')) { throw 'Branded build/icon.svg was not generated.' }
          if ((Get-Item 'build/icon.svg').Length -lt 1000) { throw 'Branded icon.svg looks invalid.' }
          if (!(Test-Path 'assets/icon.png')) { throw 'Runtime Eternal icon is missing.' }

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify updater metadata exists
        shell: pwsh
        run: |
          if (!(Test-Path 'release/latest.yml')) { throw 'electron-builder did not generate release/latest.yml; stable auto-update would not work.' }
          $latest = Get-Content 'release/latest.yml' -Raw
          if ($latest -notmatch 'version:\s*1\.0\.0') { throw 'latest.yml does not advertise v1.0.0.' }

      - name: Smoke test packaged Eternal Client.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/win-unpacked/Eternal Client.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged Eternal Client smoke test failed with exit code $($process.ExitCode)" }
          Write-Host 'Packaged Eternal Client startup smoke test passed.' -ForegroundColor Green

      - name: Prepare stable release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Copy-Item assets/eternal-core.jar "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar" -Force
          if (!(Test-Path 'release/win-unpacked')) { throw 'win-unpacked output is missing.' }
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath "release/Eternal-Client-$env:CORE_VERSION-portable.zip" -Force
          $targets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.jar','.zip','.yml' }
          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eternal-client-v1.0.0-verified
          if-no-files-found: error
          path: |
            release/*.exe
            release/*-portable.zip
            release/Eternal-Core-Standalone-1.0.0.jar
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Publish first stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          $core = Get-Item "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar"
          $portable = Get-ChildItem -Path release -Filter '*-portable.zip' -File | Select-Object -First 1
          $latest = Get-Item 'release/latest.yml'
          $checksum = Get-Item 'release/SHA256SUMS.txt'
          $files = @($installer.FullName, $core.FullName, $portable.FullName, $latest.FullName, $checksum.FullName)
          gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Eternal Client v1.0.0" --notes-file RELEASE_NOTES.md --latest
