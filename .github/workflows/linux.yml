name: Eternal Linux and Xfce

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eternal-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux amd64 package
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build shared Core
        run: gradle -p eternal-core clean build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read package version
        run: |
          release_version=$(node -p "require('./package.json').version")
          echo "LAUNCHER_VERSION=$release_version" >> "$GITHUB_ENV"
      - run: npm install
      - run: node scripts/stage-core.mjs
      - run: npm run dist:linux -- --publish never
      - name: Validate package and updater metadata
        run: |
          set -euo pipefail
          deb=release/Eternal.Client.${{ env.LAUNCHER_VERSION }}.linux-amd64.deb
          test "$(dpkg-deb -f "$deb" Version)" = '${{ env.LAUNCHER_VERSION }}'
          test "$(dpkg-deb -f "$deb" Architecture)" = 'amd64'
          dpkg-deb -x "$deb" build/deb-inspect
          test -f 'build/deb-inspect/opt/Eternal Client/resources/app.asar'
          test -f 'build/deb-inspect/usr/share/applications/gg.eternal.client.desktop'
          test "$(cat 'build/deb-inspect/opt/Eternal Client/resources/package-type')" = deb
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import yaml from 'js-yaml';
          const data = yaml.load(fs.readFileSync('release/latest-linux.yml', 'utf8'));
          const name = 'Eternal.Client.${{ env.LAUNCHER_VERSION }}.linux-amd64.deb';
          const entry = data.files.find(file => file.url === name);
          const bytes = fs.readFileSync(`release/${name}`);
          if (data.version !== '${{ env.LAUNCHER_VERSION }}' || !entry || entry.size !== bytes.length || entry.sha512 !== crypto.createHash('sha512').update(bytes).digest('base64')) throw new Error('Invalid Linux update metadata');
          NODE
          printf 'Eternal Client ${{ env.LAUNCHER_VERSION }} Linux amd64\nCommit: %s\nBuild: https://github.com/%s/actions/runs/%s\nBuilt on Ubuntu 22.04; CI launch checks use Xfce on Ubuntu 22.04 and 24.04.\nLive Minecraft and a physical Linux Mint desktop have not been tested.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release/LINUX-BUILD-INFO.txt
          cp LINUX.md release/LINUX-INSTALL.md
          cd release
          sha256sum Eternal.Client.${{ env.LAUNCHER_VERSION }}.linux-amd64.deb latest-linux.yml LINUX-BUILD-INFO.txt LINUX-INSTALL.md > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eternal-linux
          if-no-files-found: error
          path: |
            release/Eternal.Client.${{ env.LAUNCHER_VERSION }}.linux-amd64.deb
            release/latest-linux.yml
            release/SHA256SUMS-linux.txt
            release/LINUX-BUILD-INFO.txt
            release/LINUX-INSTALL.md

  desktop-check:
    name: Installed Xfce launch (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eternal-linux
          path: release
      - name: Install package and Xfce test session
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 xfce4-session xfwm4 desktop-file-utils ./release/*.deb
          desktop-file-validate /usr/share/applications/gg.eternal.client.desktop
      - name: Launch installed package with Chromium sandbox enabled
        env:
          XDG_CURRENT_DESKTOP: XFCE
          DESKTOP_SESSION: xfce
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- bash -c '
            xfwm4 --compositor=off > /tmp/eternal-xfwm.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            timeout 60 /usr/bin/eternal-client --smoke-test
          '
