name: Eternal Beta Release

on:
  push:
    branches: [main]
    paths:
      - '.release/v0.5.0-beta.5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eternal-release-v0.5.0-beta.5
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.5.0-beta.5
  CORE_VERSION: 0.5.0-beta.5

jobs:
  release:
    name: Build and publish Windows beta
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Eternal Core
        working-directory: eternal-core
        run: gradle build --stacktrace

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install launcher dependencies
        run: npm install

      - name: Stage verified Eternal Core
        run: node scripts/stage-core.mjs

      - name: Run launcher tests
        run: npm run test

      - name: Build renderer
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Copy-Item assets/eternal-core.jar "release/Eternal-Core-$env:CORE_VERSION.jar" -Force
          if (Test-Path 'release/win-unpacked') {
            Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath "release/Eternal-Client-$env:CORE_VERSION-portable.zip" -Force
          }
          $targets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.jar','.zip' }
          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          $core = Get-Item "release/Eternal-Core-$env:CORE_VERSION.jar"
          $portable = Get-ChildItem -Path release -Filter '*-portable.zip' -File | Select-Object -First 1
          $checksum = Get-Item 'release/SHA256SUMS.txt'
          $files = @($installer.FullName, $core.FullName, $checksum.FullName)
          if ($portable) { $files += $portable.FullName }
          gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Eternal Client $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease
