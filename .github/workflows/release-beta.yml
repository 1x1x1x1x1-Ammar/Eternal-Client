name: Eternal Beta Release

on:
  push:
    branches: [main]
    paths:
      - '.release/v0.8.0-beta.8'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eternal-release-v0.8.0-beta.8
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.8.0-beta.8
  CORE_VERSION: 0.8.0-beta.8

jobs:
  release:
    name: Build and publish Windows beta
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Eternal Core
        working-directory: eternal-core
        run: gradle build --stacktrace

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install launcher dependencies
        run: npm install

      - name: Stage verified Eternal Core
        run: node scripts/stage-core.mjs

      - name: Validate standalone Core JAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'assets/eternal-core.jar')) { throw 'Staged Eternal Core JAR is missing.' }
          $entries = & jar tf assets/eternal-core.jar
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Eternal Core JAR.' }
          if ($entries -notcontains 'fabric.mod.json') { throw 'Standalone Core is missing fabric.mod.json.' }
          if ($entries -notcontains 'assets/eternal-core/icon.png') { throw 'Standalone Core is missing the Eternal icon.' }
          Write-Host 'Standalone Eternal Core metadata and icon validated.' -ForegroundColor Green

      - name: Run launcher tests
        run: npm run test

      - name: Build renderer and branded Windows resources
        run: npm run build

      - name: Verify Eternal Windows icon source
        shell: pwsh
        run: |
          if (!(Test-Path 'build/icon.svg')) { throw 'Branded build/icon.svg was not generated.' }
          if ((Get-Item 'build/icon.svg').Length -lt 1000) { throw 'Branded icon.svg looks invalid.' }

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Smoke test packaged launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/win-unpacked/Eternal Client.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged Eternal Client smoke test failed with exit code $($process.ExitCode)" }
          Write-Host 'Packaged Eternal Client startup smoke test passed.' -ForegroundColor Green

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Copy-Item assets/eternal-core.jar "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar" -Force
          if (Test-Path 'release/win-unpacked') {
            Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath "release/Eternal-Client-$env:CORE_VERSION-portable.zip" -Force
          }
          $targets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.jar','.zip' }
          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          $core = Get-Item "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar"
          $portable = Get-ChildItem -Path release -Filter '*-portable.zip' -File | Select-Object -First 1
          $checksum = Get-Item 'release/SHA256SUMS.txt'
          $files = @($installer.FullName, $core.FullName, $checksum.FullName)
          if ($portable) { $files += $portable.FullName }
          gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Eternal Client $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease
