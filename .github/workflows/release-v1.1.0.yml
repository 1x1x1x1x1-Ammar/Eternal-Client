name: Eternal v1.1.0 Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.release/v1.1.0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eternal-release-v1.1.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.1.0
  CORE_VERSION: 1.1.0
  LAUNCHER_VERSION: 1.1.0

jobs:
  release:
    name: Build, verify and publish Eternal v1.1.0
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Eternal Core v1.1.0
        working-directory: eternal-core
        run: gradle clean build --stacktrace

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install launcher dependencies
        run: npm install

      - name: Stage verified Eternal Core
        run: node scripts/stage-core.mjs

      - name: Validate standalone Core JAR metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'assets/eternal-core.jar')) { throw 'Staged Eternal Core JAR is missing.' }
          $entries = & jar tf assets/eternal-core.jar
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Eternal Core JAR.' }
          foreach ($required in @('fabric.mod.json','assets/eternal-core/icon.png','gg/eternal/core/EternalCore.class','gg/eternal/core/ui/EternalUi.class','gg/eternal/core/ui/EternalHomeScreen.class','gg/eternal/core/ui/ClickGuiScreen.class','gg/eternal/core/ui/HudEditorScreen.class')) {
            if ($entries -notcontains $required) { throw "Standalone Core is missing $required" }
          }
          Push-Location $env:RUNNER_TEMP
          & jar xf "$env:GITHUB_WORKSPACE/assets/eternal-core.jar" fabric.mod.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract fabric.mod.json.' }
          $metadata = Get-Content 'fabric.mod.json' -Raw | ConvertFrom-Json
          Pop-Location
          if ($metadata.version -ne $env:CORE_VERSION) { throw "Core metadata version mismatch: $($metadata.version)" }
          if ($metadata.id -ne 'eternal-core') { throw "Unexpected Core mod id: $($metadata.id)" }
          Write-Host 'Standalone Eternal Core v1.1.0 metadata and premium UI classes validated.' -ForegroundColor Green

      - name: Run full launcher and runtime regression suite
        run: npm run test

      - name: Build renderer and branded Windows resources
        run: npm run build

      - name: Verify v1.1.0 version, release polish and branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:LAUNCHER_VERSION) { throw "package.json version mismatch: $($pkg.version)" }
          $coreProps = Get-Content 'eternal-core/gradle.properties' -Raw
          if ($coreProps -notmatch 'mod_version=1\.1\.0') { throw 'Core Gradle version is not 1.1.0.' }
          $coreSource = Get-Content 'eternal-core/src/main/java/gg/eternal/core/EternalCore.java' -Raw
          if ($coreSource -notmatch 'VERSION = "1\.1\.0"') { throw 'Core source version is not 1.1.0.' }
          $main = Get-Content 'src/main.jsx' -Raw
          if ($main -notmatch "import './v11-release\.css';") { throw 'v1.1 stable polish layer is not loaded.' }
          $studio = Get-Content 'src/components/TitleBar.jsx' -Raw
          if ($studio -notmatch "'/studio': 'CUSTOMIZATION STUDIO'") { throw 'Studio titlebar route identity is missing.' }
          if (!(Test-Path 'build/icon.svg')) { throw 'Branded build/icon.svg was not generated.' }
          if ((Get-Item 'build/icon.svg').Length -lt 1000) { throw 'Branded icon.svg looks invalid.' }
          if (!(Test-Path 'assets/icon.png')) { throw 'Runtime Eternal icon is missing.' }
          Write-Host 'Eternal Client v1.1.0 release identity validated.' -ForegroundColor Green

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify updater metadata exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'release/latest.yml')) { throw 'electron-builder did not generate release/latest.yml; stable auto-update would not work.' }
          $latest = Get-Content 'release/latest.yml' -Raw
          if ($latest -notmatch 'version:\s*1\.1\.0') { throw 'latest.yml does not advertise v1.1.0.' }

      - name: Smoke test packaged Eternal Client.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'release/win-unpacked/Eternal Client.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged Eternal Client smoke test failed with exit code $($process.ExitCode)" }
          Write-Host 'Packaged Eternal Client v1.1.0 startup smoke test passed.' -ForegroundColor Green

      - name: Prepare stable release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Where-Object { $_.Name -notlike '*blockmap*' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $expectedInstaller = "Eternal.Client.Setup.$env:LAUNCHER_VERSION.exe"
          if ($installer.Name -ne $expectedInstaller) { throw "Unexpected installer name: $($installer.Name), expected $expectedInstaller" }
          Copy-Item assets/eternal-core.jar "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar" -Force
          $targets = @(
            $installer,
            (Get-Item "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar"),
            (Get-Item 'release/latest.yml')
          )
          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eternal-client-v1.1.0-verified
          if-no-files-found: error
          path: |
            release/Eternal.Client.Setup.1.1.0.exe
            release/Eternal-Core-Standalone-1.1.0.jar
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Ensure release tag does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite a stable release." }
          $global:LASTEXITCODE = 0

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item "release/Eternal.Client.Setup.$env:LAUNCHER_VERSION.exe"
          $core = Get-Item "release/Eternal-Core-Standalone-$env:CORE_VERSION.jar"
          $latest = Get-Item 'release/latest.yml'
          $checksum = Get-Item 'release/SHA256SUMS.txt'
          $files = @($installer.FullName, $core.FullName, $latest.FullName, $checksum.FullName)
          gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Eternal Client v1.1.0 — The Client Update" --notes-file RELEASE_NOTES_v1.1.0.md --latest
